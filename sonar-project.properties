# Project identification
sonar.projectKey=e-journey-backend
sonar.projectName=TRAVELPLAN Backend Services
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Production source code
sonar.sources=services/gateway/src/main/java,services/user-service/src/main/java,services/travel-service/src/main/java

# Test source code
sonar.tests=services/gateway/src/test/java,services/user-service/src/test/java,services/travel-service/src/test/java

# Java bytecode (required for accurate Java analysis)
sonar.java.binaries=services/gateway/target/classes,services/user-service/target/classes,services/travel-service/target/classes

# Test bytecode
sonar.java.test.binaries=services/gateway/target/test-classes,services/user-service/target/test-classes,services/travel-service/target/test-classes

# Exclude generated, configuration, and boilerplate code from duplication checks
sonar.cpd.exclusions=**/target/**,**/*Application.java,**/*Config.java,**/*Configuration.java,**/*Properties.java

# Exclude generated build output and non-backend code from analysis
sonar.exclusions=**/target/**,services/client/**,services/frontend/**,**/models/**,**/dto/**,**/*Application.java,**/config/**

# Test coverage reports (generated by JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=services/gateway/target/site/jacoco/jacoco.xml,services/user-service/target/site/jacoco/jacoco.xml,services/travel-service/target/site/jacoco/jacoco.xml
