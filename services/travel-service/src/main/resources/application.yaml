server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: travel-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: travel-service-booking-graph
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.travel.booking_service.events
        spring.json.value.default.type: com.travel.travel_service.events.BookingCreatedEvent
        spring.json.use.type.headers: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/travel_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

jwt:
  secret: ${JWT_SECRET:defaultsecretkeydefaultsecretkeydefaultsecretkey}

app:
  booking:
    events-topic: ${BOOKING_EVENTS_TOPIC:booking.created.v1}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:travelplan-local}
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
