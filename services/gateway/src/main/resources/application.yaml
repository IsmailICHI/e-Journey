server:
  port: 8089

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:example.invalid}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        # 1. User Service
        - id: user-service
          uri: ${USER_SERVICE_URL:http://example.invalid:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**

        # 2. Travel Service
        - id: travel-service
          uri: ${TRAVEL_SERVICE_URL:http://example.invalid:8082}
          predicates:
            - Path=/api/v1/travels/**, /api/v1/places/public

        # 3. Payment Service
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://example.invalid:8083}
          predicates:
            - Path=/api/v1/payments/**

        # 4. Recommendation Service
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://example.invalid:8084}
          predicates:
            - Path=/api/v1/recommendations/**

jwt:
  secret: ${JWT_SECRET:example_only_not_a_real_jwt_secret}
  # expiration: 86400000

logging:
  level:
    root: INFO
    com.travel.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
management:
  tracing:
    sampling:
      probability: 1.0