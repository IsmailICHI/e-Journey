<main class="font-travel relative flex h-svh items-center justify-center overflow-hidden bg-[#080706] p-4 pt-16 text-stone-100 selection:bg-rose-200 selection:text-black sm:p-6 sm:pt-20">
  <app-navbar activePage="register" />
  <img src="/roma.jpg" alt="" aria-hidden="true" class="absolute inset-0 h-full w-full object-cover opacity-10 brightness-50" />
  <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/75 to-black"></div>
  <div class="relative z-10 grid h-[min(680px,calc(100svh-5rem))] w-full max-w-5xl grid-cols-1 overflow-hidden border border-white/15 bg-black/75 shadow-2xl backdrop-blur-sm sm:h-[min(680px,calc(100svh-6.5rem))] md:grid-cols-2">
    <section class="relative hidden flex-col justify-between overflow-hidden border-r border-white/10 p-10 md:flex">
      <img src="/roma.jpg" alt="Rome at twilight" class="absolute inset-0 h-full w-full object-cover brightness-50" />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-black/50"></div>
      <div class="relative max-w-sm pb-5">
        <p class="mb-3 text-[10px] tracking-[0.24em] text-rose-100">YOUR NEXT CHAPTER</p>
        <h1 class="font-serif-luxury text-4xl font-light leading-[1.12] text-stone-100 normal-case tracking-normal">Make room for elsewhere.</h1>
        <p class="font-serif-luxury mt-4 max-w-xs text-base italic leading-7 text-stone-300 normal-case tracking-normal">A thoughtful itinerary starts with a little inspiration.</p>
      </div>
    </section>
    <section class="auth-scroll-region flex min-h-0 items-center overflow-y-auto px-7 py-6 sm:px-12 sm:py-10">
      <div class="mx-auto my-auto w-full max-w-md">
        <p class="text-[10px] tracking-[0.24em] text-rose-100">JOIN THE COLLECTION</p>
        <h2 class="mt-3 font-sans-clean text-3xl font-light">Create account</h2>
        <p class="mt-2 text-sm text-stone-400">Start saving places worth dreaming about.</p>
        <form #registerForm="ngForm" (ngSubmit)="submit()" class="mx-auto mt-6 w-full max-w-[22rem] space-y-3 text-left sm:mt-8 sm:space-y-4">
          <label class="block text-xs text-stone-300" for="register-name">Full name
            <input id="register-name" name="name" type="text" [(ngModel)]="name" required minlength="3" maxlength="15" autocomplete="name" placeholder="Your name" class="mt-2 block w-full border border-white/15 bg-white/[0.04] px-3 py-3 text-sm text-white outline-none transition focus:border-rose-100/70 sm:px-4" />
          </label>
          <label class="block text-xs text-stone-300" for="register-email">Email address
            <input id="register-email" name="email" type="email" [(ngModel)]="email" required email autocomplete="email" placeholder="you@example.com" class="mt-2 block w-full border border-white/15 bg-white/[0.04] px-3 py-3 text-sm text-white outline-none transition focus:border-rose-100/70 sm:px-4" />
          </label>
          <label class="block text-xs text-stone-300" for="register-password">Password
            <input id="register-password" name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" class="mt-2 block w-full border border-white/15 bg-white/[0.04] px-3 py-3 text-sm text-white outline-none transition focus:border-rose-100/70 sm:px-4" />
          </label>
          <p *ngIf="errorMessage" role="alert" class="border border-red-300/30 bg-red-950/30 px-3 py-2 text-xs text-red-200">{{ errorMessage }}</p>
          <button type="submit" [disabled]="registerForm.invalid || submitting" class="block w-full border border-rose-100/70 bg-rose-100 py-3 text-center text-xs font-semibold tracking-[0.16em] text-[#171312] transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-40">{{ submitting ? 'CREATING ACCOUNT…' : 'CREATE ACCOUNT' }}</button>
        </form>
        <p class="mt-6 text-center text-xs text-stone-400">Already a member? <a routerLink="/login" class="text-rose-100 underline decoration-white/30 underline-offset-4 hover:text-white">Sign in</a></p>
      </div>
    </section>
  </div>
</main>
