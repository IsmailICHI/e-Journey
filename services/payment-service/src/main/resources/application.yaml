server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

jwt:
  secret: ${JWT_SECRET:defaultsecretkeydefaultsecretkeydefaultsecretkey}

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  mad-per-usd-rate: ${PAYPAL_MAD_PER_USD:10}

stripe:
  base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
  secret-key: ${STRIPE_SECRET_KEY:}
  client-base-url: ${CLIENT_BASE_URL:http://localhost:4200}

booking-service:
  base-url: ${BOOKING_SERVICE_URL:http://localhost:8085}
  confirmation-secret: ${BOOKING_PAYMENT_CONFIRMATION_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
