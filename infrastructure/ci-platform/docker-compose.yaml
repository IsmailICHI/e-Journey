name: travelplan-ci

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: travelplan-sonar-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-travelplan-sonar-local-only}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - sonar-database

  sonarqube:
    image: sonarqube:lts-community
    container_name: travelplan-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-travelplan-sonar-local-only}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONARQUBE_FORWARD_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      ci-platform:
        aliases:
          - sonarqube
      sonar-database: {}

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: travelplan/jenkins:local
    container_name: travelplan-jenkins
    depends_on:
      - sonarqube
    user: root
    entrypoint: ["/usr/local/bin/jenkins-entrypoint"]
    command: ["--httpPort=8080"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_SOCKET_GID: "${DOCKER_SOCKET_GID:-0}"
      DOCKER_SOCKET_PATH: "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}"
    ports:
      - "${JENKINS_FORWARD_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ci-platform:
        aliases:
          - jenkins
    volumes:
      - jenkins-home:/var/jenkins_home
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - /opt/travelplan-ci/.env:/run/host-project.env:ro
      - /var/lib/travelplan-ci/jenkins-deploy-key:/run/host-deploy-key:ro
      - /etc/ssh/ssh_host_ed25519_key.pub:/run/host-ssh-host-key.pub:ro
    restart: unless-stopped

volumes:
  sonar-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  jenkins-home:

networks:
  ci-platform:
    name: travelplan-ci
    driver: bridge
  sonar-database:
    name: travelplan-sonar-database
    driver: bridge
    internal: true
