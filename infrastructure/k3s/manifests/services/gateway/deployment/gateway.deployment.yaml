apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: travel-plan/gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
            - name: management
              containerPort: 8090
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: gateway-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: redis-password
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: TRAVEL_SERVICE_URL
              value: http://travel-service:8082
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8083
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-service:8084
            - name: CORS_ALLOWED_ORIGINS
              value: https://admin.example.com
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 25
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi