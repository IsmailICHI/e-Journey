---
- name: Validate the local k3s cluster health
  hosts: k3s_server
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Check node readiness
      ansible.builtin.command: kubectl get nodes
      changed_when: false

    - name: Check namespace resources
      ansible.builtin.command: kubectl get all -n travel-plan
      changed_when: false

    - name: Check ingress resources
      ansible.builtin.command: kubectl get ingress -n travel-plan
      changed_when: false
