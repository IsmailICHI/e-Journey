---
- name: Install a single-node k3s cluster for Travel-Plan
  hosts: k3s_server
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Ensure the system resolver drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure DNS for the VirtualBox NAT network
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-travel-plan-vagrant.conf
        content: |
          [Resolve]
          DNS=10.0.2.3
          FallbackDNS=
          DNSSEC=no
        owner: root
        group: root
        mode: '0644'
      register: vagrant_dns_config

    - name: Restart the system resolver when its configuration changes
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
      when: vagrant_dns_config.changed

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - docker.io
        state: present
        update_cache: true
        lock_timeout: 600
      when: ansible_os_family == 'Debian'

    - name: Start Docker for building local application images
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Check whether k3s is already installed
      ansible.builtin.command: k3s --version
      register: k3s_version_check
      failed_when: false
      changed_when: false

    - name: Install k3s when it is missing
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      args:
        executable: /bin/bash
      when: k3s_version_check.rc != 0

    - name: Wait for k3s API server to respond
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Wait for the k3s node to become Ready
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_nodes
      retries: 12
      delay: 10
      until: k3s_nodes.rc == 0 and ' Ready ' in k3s_nodes.stdout
      changed_when: false

    - name: Show the installed version
      ansible.builtin.command: k3s --version
      changed_when: false
