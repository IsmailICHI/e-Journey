---
- name: Configure kubectl access for the local k3s cluster
  hosts: k3s_server
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Ensure the default kubectl config directory exists
      ansible.builtin.file:
        path: "/home/{{ kubectl_user }}/.kube"
        state: directory
        mode: '0700'
        owner: "{{ kubectl_user }}"
        group: "{{ kubectl_user }}"

    - name: Copy the k3s kubeconfig to the user's home directory
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ kubectl_user }}/.kube/config"
        remote_src: true
        mode: '0600'
        owner: "{{ kubectl_user }}"
        group: "{{ kubectl_user }}"

    - name: Replace the default localhost listener with the actual node address
      ansible.builtin.replace:
        path: "/home/{{ kubectl_user }}/.kube/config"
        regexp: 'https://127.0.0.1:6443'
        replace: "https://{{ k3s_server_ip }}:6443"

    - name: Validate kubectl access
      ansible.builtin.command: kubectl get nodes
      become_user: "{{ kubectl_user }}"
      environment:
        KUBECONFIG: "/home/{{ kubectl_user }}/.kube/config"
      register: kubectl_nodes
      changed_when: false
