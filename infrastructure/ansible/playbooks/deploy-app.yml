---
- name: Deploy the Travel-Plan application into k3s
  hosts: k3s_server
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  vars:
    # Application secrets come from the ignored repository-root .env file on the
    # workstation (override with -e travel_plan_env_file=/path/to/.env). They are
    # sent to kubectl over stdin and never written to disk on the VM.
    travel_plan_env_file: "{{ playbook_dir }}/../../../.env"
    travel_plan_required_secrets:
      - JWT_SECRET
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - REDIS_PASSWORD
      - NEO4J_PASSWORD
      - BOOKING_PAYMENT_CONFIRMATION_SECRET

  tasks:
    - name: Check that the .env file exists on the workstation
      ansible.builtin.stat:
        path: "{{ travel_plan_env_file }}"
      delegate_to: localhost
      become: false
      register: travel_plan_env_stat

    - name: Require the .env file
      ansible.builtin.assert:
        that: travel_plan_env_stat.stat.exists
        fail_msg: >-
          {{ travel_plan_env_file }} is missing. Copy .env.example to .env at the
          repository root and fill in the application secrets.

    - name: Load application settings from .env
      ansible.builtin.set_fact:
        travel_plan_env: >-
          {{ travel_plan_env | default({}) | combine({
               (item.split('=', 1)[0] | trim):
               (item.split('=', 1)[1] | trim | regex_replace('^([\"'']?)(.*)\1$', '\2'))
             }) }}
      loop: "{{ lookup('ansible.builtin.file', travel_plan_env_file).splitlines()
                | select('match', '^\\s*[A-Za-z_][A-Za-z0-9_]*\\s*=') | list }}"
      no_log: true

    - name: Require the application secrets in .env
      ansible.builtin.assert:
        that: (travel_plan_env[item] | default('')) | length > 0
        fail_msg: "{{ item }} must be set to a non-empty value in .env"
        quiet: true
      loop: "{{ travel_plan_required_secrets }}"

    - name: Ensure the application namespace exists
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - /vagrant/k8s/base/namespace.yaml
      changed_when: false

    - name: Apply the application Secret from .env
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          # Server-side apply: client-side apply would copy every secret value
          # in plain text into the last-applied-configuration annotation.
          - --server-side
          - --force-conflicts
          - --field-manager=travel-plan-deploy
          - --filename=-
        stdin: "{{ {
          'apiVersion': 'v1',
          'kind': 'Secret',
          'metadata': {'name': 'travel-plan-secrets', 'namespace': 'travel-plan'},
          'type': 'Opaque',
          'stringData': {
            'jwt-secret': travel_plan_env.JWT_SECRET,
            'postgres-user': travel_plan_env.POSTGRES_USER,
            'postgres-password': travel_plan_env.POSTGRES_PASSWORD,
            'redis-password': travel_plan_env.REDIS_PASSWORD,
            'neo4j-password': travel_plan_env.NEO4J_PASSWORD,
            'paypal-client-id': travel_plan_env.PAYPAL_CLIENT_ID | default(''),
            'paypal-client-secret': travel_plan_env.PAYPAL_CLIENT_SECRET | default(''),
            'stripe-secret-key': travel_plan_env.STRIPE_SECRET_KEY | default(''),
            'booking-payment-confirmation-secret': travel_plan_env.BOOKING_PAYMENT_CONFIRMATION_SECRET
          }} | to_json }}"
        stdin_add_newline: true
      register: secret_apply
      no_log: true
      changed_when: "' created' in secret_apply.stdout or ' configured' in secret_apply.stdout"

    - name: Build application images and import them into k3s
      ansible.builtin.shell: |
        set -euo pipefail
        archive="$(mktemp)"
        docker build --file "/vagrant/{{ item.dockerfile }}" --tag "{{ item.image }}" /vagrant
        docker save --output "$archive" "{{ item.image }}"
        k3s ctr images import "$archive"
        rm -f "$archive"
      args:
        executable: /bin/bash
      loop:
        - dockerfile: services/client/Dockerfile
          image: travelplan/frontend:dev
        - dockerfile: services/gateway/Dockerfile
          image: travelplan/gateway:dev
        - dockerfile: services/user-service/Dockerfile
          image: travelplan/user-service:dev
        - dockerfile: services/travel-service/DockerFile
          image: travelplan/travel-service:dev
        - dockerfile: services/booking-service/Dockerfile
          image: travelplan/booking-service:dev
        - dockerfile: services/payment-service/Dockerfile
          image: travelplan/payment-service:dev
      changed_when: true

    - name: Apply the application manifests from the repo
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -k
          - /vagrant/k8s/overlays/dev
      changed_when: true

    - name: Read the desired Neo4j StatefulSet revision
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - get
          - statefulset
          - neo4j
          - -o
          - jsonpath={.status.updateRevision}
      register: neo4j_update_revision
      changed_when: false

    - name: Read the current Neo4j pod revision
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - get
          - pod
          - neo4j-0
          - -o
          - jsonpath={.metadata.labels.controller-revision-hash}
      register: neo4j_pod_revision
      changed_when: false

    - name: Replace a stale Neo4j pod so it adopts the current StatefulSet template
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - delete
          - pod
          - neo4j-0
          - --wait=true
      when: neo4j_pod_revision.stdout != neo4j_update_revision.stdout
      changed_when: true

    - name: Wait for Neo4j to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - rollout
          - status
          - statefulset/neo4j
          - --timeout=600s
      changed_when: false

    - name: Wait for PostgreSQL to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - rollout
          - status
          - statefulset/postgres
          - --timeout=180s
      changed_when: false

    - name: Wait for Kafka and Elasticsearch to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - rollout
          - status
          - "statefulset/{{ item }}"
          - --timeout=600s
      loop:
        - kafka
        - elasticsearch
      changed_when: false

    - name: Read existing PostgreSQL databases
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - exec
          - postgres-0
          - --
          - psql
          - -U
          - "{{ travel_plan_env.POSTGRES_USER }}"
          - -d
          - postgres
          - -tAc
          - "SELECT datname FROM pg_database"
      register: postgres_databases
      changed_when: false

    - name: Create missing application databases
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - exec
          - postgres-0
          - --
          - psql
          - -U
          - "{{ travel_plan_env.POSTGRES_USER }}"
          - -d
          - postgres
          - -c
          - "CREATE DATABASE {{ item }}"
      loop:
        - user_db
        - travel_db
        - booking_db
        - payment_db
      when: item not in postgres_databases.stdout_lines
      changed_when: true

    - name: Wait for application deployments to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - travel-plan
          - rollout
          - status
          - "deployment/{{ item }}"
          - --timeout=180s
      loop:
        - frontend
        - gateway
        - user-service
        - travel-service
        - booking-service
        - payment-service
      changed_when: false