---
- name: Deploy the e-Journey gateway to K3s
  hosts: k3s
  gather_facts: false
  vars:
    gateway_namespace: e-journey
    gateway_manifests: "{{ playbook_dir }}/../k3s/manifests/services/gateway"
    gateway_image: "{{ lookup('env', 'GATEWAY_IMAGE') }}"
    gateway_jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    gateway_redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"

  pre_tasks:
    - name: Validate required deployment inputs
      ansible.builtin.assert:
        that:
          - gateway_image | length > 0
          - gateway_jwt_secret | length >= 32
          - gateway_redis_password | length >= 16
        fail_msg: Set GATEWAY_IMAGE, JWT_SECRET (32+ characters), and REDIS_PASSWORD (16+ characters).

  tasks:
    - name: Create gateway namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ gateway_namespace }}"

    - name: Apply gateway runtime secrets
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-secrets
            namespace: "{{ gateway_namespace }}"
          type: Opaque
          stringData:
            jwt-secret: "{{ gateway_jwt_secret }}"
            redis-password: "{{ gateway_redis_password }}"

    - name: Apply gateway resources
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -k
          - "{{ gateway_manifests }}"
      changed_when: true

    - name: Set gateway image
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ gateway_namespace }}"
          - set
          - image
          - deployment/gateway
          - "gateway={{ gateway_image }}"
      changed_when: true

    - name: Wait for gateway rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ gateway_namespace }}"
          - rollout
          - status
          - deployment/gateway
          - --timeout=180s
      changed_when: false