apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-boot-services'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
            - 'gateway-service.default.svc.cluster.local:8089'
            - 'user-service.default.svc.cluster.local:8081'
            - 'travel-service.default.svc.cluster.local:8082'