apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: travel-plan
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-boot-services'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'gateway.travel-plan.svc.cluster.local:8090'
              - 'user-service.travel-plan.svc.cluster.local:8081'
              - 'travel-service.travel-plan.svc.cluster.local:8082'