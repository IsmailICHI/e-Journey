apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-service
  namespace: travel-plan
  labels:
    app.kubernetes.io/name: travel-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-service
  template:
    metadata:
      labels:
        app: travel-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: travel-service
          image: travelplan/travel-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: travel-plan-config
                  key: travel-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: travel-plan-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-plan-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-plan-secrets
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: travel-plan-config
                  key: kafka-bootstrap-servers
            - name: BOOKING_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: travel-plan-config
                  key: booking-events-topic
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: travel-plan-config
                  key: neo4j-uri
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-plan-secrets
                  key: neo4j-password
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: travel-plan-config
                  key: elasticsearch-url
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
