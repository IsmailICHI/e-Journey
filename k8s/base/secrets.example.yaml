apiVersion: v1
kind: Secret
metadata:
  name: travel-plan-secrets
  namespace: travel-plan
  labels:
    app.kubernetes.io/name: travel-plan-secrets
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  jwt-secret: "replace-with-a-long-random-secret"
  postgres-user: "postgres"
  postgres-password: "change-me"
  redis-password: "change-me"
  neo4j-password: "change-me"
  paypal-client-id: ""
  paypal-client-secret: ""
  stripe-secret-key: ""
  booking-payment-confirmation-secret: "replace-with-the-same-random-value-in-booking-and-payment"
# This file is intentionally an example only. Create the real Secret with a secure value
# before running the deployment on a real cluster.
