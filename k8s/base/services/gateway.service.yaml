apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: travel-plan
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8089
      targetPort: 8089
    - name: management
      port: 8090
      targetPort: 8090