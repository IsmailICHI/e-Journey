apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-plan-config
  namespace: travel-plan
  labels:
    app.kubernetes.io/name: travel-plan-config
    app.kubernetes.io/component: configuration
data:
  app-environment: dev
  postgres-db: postgres
  postgres-user: postgres
  user-database: user_db
  travel-database: travel_db
  gateway-public-host: travel-plan.local
  cors-allowed-origins: http://travel-plan.local
  redis-host: redis
  redis-port: "6379"
  user-service-url: http://user-service:8081
  travel-service-url: http://travel-service:8082
  frontend-host: travel-plan.local
