apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-plan-config
  namespace: travel-plan
  labels:
    app.kubernetes.io/name: travel-plan-config
    app.kubernetes.io/component: configuration
data:
  app-environment: dev
  postgres-db: postgres
  postgres-user: postgres
  user-database: user_db
  travel-database: travel_db
  travel-datasource-url: jdbc:postgresql://postgres:5432/travel_db
  booking-database: booking_db
  booking-datasource-url: jdbc:postgresql://postgres:5432/booking_db
  payment-database: payment_db
  payment-datasource-url: jdbc:postgresql://postgres:5432/payment_db
  gateway-public-host: travel-plan.local
  cors-allowed-origins: http://travel-plan.local
  redis-host: redis
  redis-port: "6379"
  user-service-url: http://user-service:8081
  travel-service-url: http://travel-service:8082
  booking-service-url: http://booking-service:8085
  payment-service-url: http://payment-service:8083
  kafka-bootstrap-servers: kafka:9092
  booking-events-topic: booking.created.v1
  neo4j-uri: bolt://neo4j:7687
  elasticsearch-url: http://elasticsearch:9200
  paypal-base-url: https://api-m.sandbox.paypal.com
  paypal-mad-per-usd: "10"
  stripe-base-url: https://api.stripe.com
  client-base-url: https://travel-plan.local:8443
  frontend-host: travel-plan.local
