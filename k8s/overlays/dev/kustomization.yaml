apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travel-plan
resources:
  - ../../base
images:
  - name: travelplan/frontend
    newTag: dev
  - name: travelplan/gateway
    newTag: dev
  - name: travelplan/user-service
    newTag: dev
  - name: travelplan/travel-service
    newTag: dev
patches:
  - target:
      kind: Ingress
      name: travel-plan
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
  - target:
      kind: Ingress
      name: travel-plan
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: travel-plan.local
  - target:
      kind: HorizontalPodAutoscaler
      name: gateway
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: user-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: travel-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - name: CORS_ALLOWED_ORIGINS
                    value: https://travel-plan.local:8443
