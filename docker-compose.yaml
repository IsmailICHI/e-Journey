services:
  postgres:
    image: postgres:15-alpine
    container_name: neo4flix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - neo4flix-net

  redis:
    image: redis:7-alpine
    container_name: movie_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - neo4flix-net

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4flix-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u '${NEO4J_USERNAME}' -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - neo4flix-net
